<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Birita Desaparecida — Portal</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Neumorphic decorative circles */
    .decoration {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: var(--bg-base);
      transition: all 500ms ease-out;
    }
    
    .decoration-1 {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
      box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
      animation: float 6s ease-in-out infinite;
    }
    
    .decoration-2 {
      width: 200px;
      height: 200px;
      bottom: -50px;
      left: -50px;
      box-shadow: inset 10px 10px 20px var(--shadow-dark), inset -10px -10px 20px var(--shadow-light);
      animation: float 8s ease-in-out infinite 1s;
    }
    
    .decoration-3 {
      width: 150px;
      height: 150px;
      top: 50%;
      left: 10%;
      box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
      animation: float 7s ease-in-out infinite 2s;
    }
  </style>
</head>
<body>
  <!-- Neumorphic decorations -->
  <div class="decoration decoration-1"></div>
  <div class="decoration decoration-2"></div>
  <div class="decoration decoration-3"></div>
  
  <div class="container">
    <h1>🍾 A Birita Desaparecida</h1>
    <p class="subtitle">O open bar esta trancado</p>
    
    <p>Voce recebeu um codigo no cartao-postal.<br>
    Encontre a bebida desaparecida para abrir o open bar.</p>
    
    <form id="codigoForm">
      <input 
        type="text" 
        id="codigoInput" 
        placeholder="Digite seu código"
        autocomplete="off"
        required
      >
      <button type="submit">Entrar</button>
    </form>
    
    <p class="error-message" id="errorMessage">
      Codigo nao reconhecido. Confira o cartao-postal da sua equipe.
    </p>
    
    <p class="footer">
      "Toda garrafa deixa uma pista..."
    </p>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/access.js"></script>
  <script>
    document.getElementById('codigoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const input = document.getElementById('codigoInput');
      const errorMsg = document.getElementById('errorMessage');
      
      // Normalizar o código: trim e uppercase
      const codigo = input.value.trim().toUpperCase();
      
      // Verificar se o código existe no mapa
      if (ARG_CONFIG.codigos[codigo]) {
        const destino = ARG_CONFIG.codigos[codigo];
        const equipe = destino.match(/equipes\/([^/]+)\.html$/)[1];
        ARG_ACCESS.startTeam(equipe);
        // A rota genérica recebe uma chave que muda automaticamente a cada dia.
        window.location.href = `e.html?chave=${ARG_ACCESS.tokenFor(equipe)}`;
      } else {
        // Mostrar mensagem de erro
        errorMsg.classList.add('show');
        input.value = '';
        input.focus();
        
        // Esconder mensagem após 3 segundos
        setTimeout(function() {
          errorMsg.classList.remove('show');
        }, 3000);
      }
    });

    // Limpar mensagem de erro quando usuário começar a digitar
    document.getElementById('codigoInput').addEventListener('input', function() {
      document.getElementById('errorMessage').classList.remove('show');
    });
  </script>
</body>
</html>
